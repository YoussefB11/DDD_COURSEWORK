name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ./DDD_COURSEWORK/DDD_COURSEWORK.sln

    - name: Build
      run: dotnet build ./DDD_COURSEWORK/DDD_COURSEWORK.sln --no-restore

    - name: Run tests
      run: dotnet test ./DDD_COURSEWORK/DDD_COURSEWORK.sln --no-build --verbosity normal
